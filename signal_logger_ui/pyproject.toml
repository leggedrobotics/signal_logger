[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "signal_logger_ui"
version = "0.1.0"
description = "PyQt/PySide6 visualizer for signal_logger files."
requires-python = ">=3.8"
dependencies = [
    "signal_logger_python",
    "PySide6",
    "numpy",
    "matplotlib",
    "qtconsole",
    "ipykernel",
]

[project.scripts]
signal_logger_ui = "signal_logger_ui.signal_log_ui:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["signal_logger_ui*"]
