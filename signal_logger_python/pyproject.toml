[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "signal_logger_python"
version = "0.1.0"
description = "Python reader/Silo helper for signal_logger files."
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
shell = ["ipython"]

[project.scripts]
signal_logger_reader = "signal_logger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["signal_logger*"]
